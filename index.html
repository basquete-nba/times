/* CONFERÊNCIAS DA NBA */
const conferences = {
  /* LESTE */
  "atlanta-hawks": "Leste",
  "boston-celtics": "Leste",

/* LOGOS ESPECIAIS */
const customLogos = {
  "denver-nuggets":
    "https://upload.wikimedia.org/wikipedia/en/7/76/Denver_Nuggets.svg",

  "los-angeles-clippers":
    "https://upload.wikimedia.org/wikipedia/en/b/bb/Los_Angeles_Clippers_%282024%29.svg"
};

/* NORMALIZAR NOME DA CONFERÊNCIA */
function obterConferencia(team) {
  const valor = String(
    team.conference ||
    team.conferencia ||
    team.division ||
    ""
  ).toLowerCase();

  if (
    valor.includes("east") ||
    valor.includes("leste")
  ) {
    return "Leste";
  }

  if (
    valor.includes("west") ||
    valor.includes("oeste")
  ) {
    return "Oeste";
  }

  return conferences[team.slug] || "";
}

/* CRIAR CARTÃO DO TIME */
function criarCartao(team, modo) {
  const div = document.createElement("div");
  div.className = "card";

  const conferencia = obterConferencia(team);

  if (conferencia === "Leste") {
    div.classList.add("conference-east");
  } else if (conferencia === "Oeste") {
    div.classList.add("conference-west");
  }

  const logo =
    customLogos[team.slug] ||
    `https://loodibee.com/wp-content/uploads/nba-${team.slug}-logo.png`;

  const img = document.createElement("img");
  img.src = logo;
  img.alt = `Logo ${team.name}`;

  img.onerror = function() {
    this.onerror = null;
    this.src =
      "https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg";
  };

  const content = document.createElement("div");
  content.className = "card-content";

  const nome = document.createElement("span");
  nome.textContent = team.name;

  const info = document.createElement("span");
  info.className = "info";
  info.textContent = conferencia;

  content.appendChild(nome);

  if (conferencia) {
    content.appendChild(info);
  }

  div.appendChild(img);
  div.appendChild(content);

  if (modo === "jogadores") {
    div.onclick = async () => {
      try {
        await navigator.clipboard.writeText(team.text);
      } catch (e) {
        console.warn("Não foi possível copiar o texto:", e);
      }

      window.open(
        `https://www.google.com/search?q=${encodeURIComponent(team.text)}`,
        "_blank"
      );
    };
  }

  if (modo === "elencos") {
    div.onclick = () => {
      const imagem = rosterLinks[team.slug];

      if (!imagem) {
        alert(
          "Imagem do elenco ainda não cadastrada para este time."
        );
        return;
      }

      const rosterImage =
        document.getElementById("rosterImage");

      rosterImage.onerror = function() {
        this.onerror = null;
        alert(
          "Não foi possível carregar a imagem deste elenco. Verifique se o arquivo está compartilhado para visualização por qualquer pessoa com o link."
        );
      };

      rosterImage.src = imagem;

      document.getElementById("rosterTitle").innerText =
        team.name;

      document.getElementById("rosterModal")
        .classList.add("active");
    };
  }

  return div;
}

/* MONTAGEM DAS LISTAS */
try {
  if (typeof teams !== "undefined" && Array.isArray(teams)) {
    const playerContainer =
      document.getElementById("teams");

    const rosterContainer =
      document.getElementById("rosterTeams");

    /* Não alterar a ordem original dos dados */
    const sortedTeams = [...teams].sort((a, b) =>
      a.name.localeCompare(b.name, "pt-BR")
    );

    sortedTeams.forEach(team => {
      playerContainer.appendChild(
        criarCartao(team, "jogadores")
      );

      rosterContainer.appendChild(
        criarCartao(team, "elencos")
      );
    });
  } else {
    console.error(
      "A variável teams não foi encontrada. Verifique o arquivo times.js."
    );
  }
} catch (e) {
  console.error("Erro ao montar as listas:", e);
}

/* FECHAR MODAL */
function fecharModal() {
  document.getElementById("rosterModal")
    .classList.remove("active");

  document.getElementById("rosterImage").src = "";
}

/* FECHAR CLICANDO FORA DA IMAGEM */
function fecharElenco(event) {
  if (event.target.id === "rosterModal") {
    fecharModal();
  }
}

/* ESC PARA FECHAR */
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    fecharModal();
  }
});

/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js")
      .catch(error => {
        console.warn(
          "Não foi possível registrar o Service Worker:",
          error
        );
      });
  });
}
